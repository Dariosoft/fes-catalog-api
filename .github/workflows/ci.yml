# Validates every pull request into dev or main. A single Maven invocation runs
# Checkstyle, all tests (Testcontainers needs the Docker available on the runner)
# and the 90% line-coverage gate, because Checkstyle, JaCoCo and the surefire
# tests are bound to the Maven lifecycle in pom.xml.
#
# On pushes to dev or main it also publishes the SonarQube Cloud analysis, which
# reuses target/site/jacoco/jacoco.xml generated by the previous step. SonarQube
# Cloud follows the GitHub default branch, which is dev: that is the project's
# main branch and the one shown on the Overview dashboard.
#
# Requirements before the SonarQube step can run:
# - Organization secret SONAR_TOKEN with a SonarQube Cloud token (Dariosoft org,
#   Actions secrets, shared with this repository).
# - Automatic Analysis disabled for the fes-catalog-api project: SonarQube Cloud
#   rejects CI-based analysis while it is enabled.
#
# The SonarQube step runs for every event: the `if` that limited it to the main
# branch is commented out. With sonar.qualitygate.wait the step waits for the
# analysis to be processed and fails the job when the quality gate fails.
#
# Dependency vulnerabilities are reported, not enforced yet: set exit-code to
# '1' on the Trivy step to fail the job on HIGH or CRITICAL findings.
#
# Secrets are reported too. The local guard is the versioned pre-commit hook in
# .githooks: enable it with `git config core.hooksPath .githooks`.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify catalog-api
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, Checkstyle, tests and coverage
        run: ./mvnw --batch-mode verify

      - name: Generate SBOM
        run: ./mvnw --batch-mode cyclonedx:makeBom

      - name: Dependency vulnerability report (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/bom.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'

      - name: Secret scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '0'
          skip-dirs: target,.git

      - name: SonarQube Cloud analysis
        #if: github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw --batch-mode sonar:sonar -Dsonar.qualitygate.wait=true
