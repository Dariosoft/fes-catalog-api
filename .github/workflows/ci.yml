# Validates every pull request into dev or main. A single Maven invocation runs
# Checkstyle, all tests (Testcontainers needs the Docker available on the runner)
# and the 90% line-coverage gate, because Checkstyle, JaCoCo and the surefire
# tests are bound to the Maven lifecycle in pom.xml.
#
# On pushes to main it also publishes the SonarQube Cloud analysis, which reuses
# target/site/jacoco/jacoco.xml generated by the previous step.
#
# Requirements before the SonarQube step can run:
# - Organization secret SONAR_TOKEN with a SonarQube Cloud token (Dariosoft org,
#   Actions secrets, shared with this repository).
# - Automatic Analysis disabled for the fes-catalog-api project: SonarQube Cloud
#   rejects CI-based analysis while it is enabled.
#
# SonarQube Cloud analyzes the main branch only on the Free plan; pull request
# analysis requires a plan with branch analysis (Team or above). When the plan
# changes, drop the `if` of the SonarQube step to analyze every pull request.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify catalog-api
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, Checkstyle, tests and coverage
        run: ./mvnw --batch-mode verify

      - name: SonarQube Cloud analysis
        #if: github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw --batch-mode sonar:sonar
